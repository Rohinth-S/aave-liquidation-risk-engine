[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aave-liquidation-risk-engine"
dynamic = ["version"]
description = "Multi-reserve Aave oracle and liquidation stress replay"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30", "web3>=7.5"]

[project.optional-dependencies]
dashboard = ["pandas>=2.1", "streamlit>=1.40"]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
aave_liquidation_risk_engine = "aave_risk.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "aave_risk.__version__"}
