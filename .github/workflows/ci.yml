name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dashboard,test]'
      - run: python -m pytest -q
      - run: python -m aave_risk.cli --output /tmp/aave-risk.json
      - run: docker compose up --build --detach --wait
      - run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8501/_stcore/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
