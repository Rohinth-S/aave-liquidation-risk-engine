services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 4s
      retries: 12
  dashboard:
    build: .
    environment:
      AAVE_RISK_API: http://api:8000
    command: ["streamlit", "run", "src/aave_risk/dashboard.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
